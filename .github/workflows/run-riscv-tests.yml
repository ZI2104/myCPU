name: "Run riscv-tests (DiffTest)"

on:
  workflow_dispatch:
    inputs:
      max_tests:
        description: "Maximum number of tests to run (0 = all)"
        required: false
        default: "10"

jobs:
  riscv-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install common packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git pkg-config ca-certificates wget

      - name: Install QEMU RISC-V
        run: |
          sudo apt-get install -y qemu-system-riscv

      - name: Install riscv toolchain from apt
        run: |
          set -euo pipefail
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
          riscv64-unknown-elf-gcc --version

      - name: Build myCPU (release)
        run: |
          cargo build --release

      - name: Run riscv-tests script
        env:
          RUST_LOG: info
        run: |
          chmod +x ./scripts/run_riscv_tests.sh
          ./scripts/run_riscv_tests.sh ${{ github.event.inputs.max_tests }}
      - name: Upload riscv-tests perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riscv-tests-perf-json
          path: artifacts/riscv-tests/
